[package]
name = "movie-streamer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Self-hosted movie streamer: torrent search + HLS playback over Rust/Axum/Tokio"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
    "process",
    "io-util",
    "sync",
    "time",
    "signal",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["trace", "fs"] }
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["gzip", "brotli"] }
url = "2"
percent-encoding = "2"
roxmltree = "0.21"
scraper = "0.29"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
anyhow = "1"

[dev-dependencies]
anyhow = "1"
tower = { version = "0.5.3", features = ["util"] }
