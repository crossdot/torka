# Single-container deployment for the movie-streamer backend (ADR-004 model 1,
# ADR-006 Synology constraints).
#
# Before starting: cp ENV.example .env and replace APP_API_TOKEN with a strong
# secret. Secrets stay in `.env` and are never baked into the image.
#
# Do not use privileged mode, do not mount the Docker socket, and do not add
# extra capabilities — the container only needs network access plus the
# data volumes below.
services:
  movie-streamer:
    build:
      context: .
      dockerfile: Dockerfile
    image: movie-streamer:0.1.0
    container_name: movie-streamer
    restart: unless-stopped
    # Reap the FFmpeg/FFprobe children spawned per playback session.
    init: true
    ports:
      # Single published port; put TLS/remote access in front via VPN or a
      # separate reverse proxy (see DOCKER_SYNOLOGY.md).
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      CACHE_DIR: "/cache"
      SESSION_DIR: "/cache/sessions"
    volumes:
      # Bounded scratch space for sessions and HLS segments (CACHE_MAX_BYTES).
      # The host directory must be writable by uid/gid 10001:
      #   install -d -o 10001 -g 10001 ./cache
      - ./cache:/cache
      # Optional read-only configuration directory.
      # - ./config:/config:ro
    # VA-API hardware acceleration (Intel iGPU / AMD, ADR-008). Enable only on
    # hosts that expose a render node; `vainfo --display drm --device
    # /dev/dri/renderD128` must succeed inside the container. HWACCEL_MODE=auto
    # falls back to software when the probe fails.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   # Numeric GID of the render node: stat -c '%g' /dev/dri/renderD128
    #   - "104"
    security_opt:
      - no-new-privileges:true
    # Configure resource limits in Synology Container Manager if this Compose
    # version does not support the desired deploy limits.
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2g
    #       cpus: "2.0"
